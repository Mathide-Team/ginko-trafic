[project]
name = "ginko-trafic"
version = "0.1.0"
description = "Infos trafic et temps d'attente Ginko (Besançon) pour Home Assistant"
requires-python = ">=3.13.2,<3.14"
license = "MIT"

[dependency-groups]
# Versions figées (socle) : à monter volontairement.
test = [
    "pytest-homeassistant-custom-component==0.13.316",  # Home Assistant 2026.2.3, Python 3.13
]
lint = ["ruff==0.17.1"]
scripts = ["loguru==0.7.3"]  # journalisation des scripts du dépôt (SOCLE §8)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["scripts/check_branch_protection.py"]  # script du socle (modele-depot), gardé tel quel

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["custom_components/ginko_trafic"]

[tool.uv]
package = false  # intégration HA, pas un paquet Python publié
