# Publication d'une version : pousser un tag vX.Y.Z égal à la version de
# manifest.json, après avoir daté sa section dans CHANGELOG.md. HACS installe
# ensuite la version depuis la release (zip de custom_components/ginko_trafic).
name: Release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publication
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Tag = version du manifest, notes tirées du CHANGELOG
        run: python3 scripts/notes_de_version.py "${GITHUB_REF_NAME}" > notes.md

      - name: Archive de l'intégration
        run: cd custom_components/ginko_trafic && python3 -m zipfile -c ../../ginko_trafic.zip .

      - name: Release GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: ginko_trafic.zip
          fail_on_unmatched_files: true
